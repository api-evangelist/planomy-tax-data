apis:
  - name: Planomy Tax Data JSON
    description: >-
      A free, no-auth JSON dataset of 2026 US tax and retirement figures, served as two static files:
      a manifest at /tax-data/index.json listing every published year, and one complete document per
      year at /tax-data/{year}.json. Keyless and unmetered. Responses carry a strong ETag and honour
      If-None-Match, so the correct client pattern is a conditional GET rather than polling. The
      documentation states the endpoint sends no Access-Control-Allow-Origin header and should be
      consumed server-side; as of 2026-08-09 the edge actually returns a wildcard, so simple browser
      fetches work, though OPTIONS returns 405 so preflighted requests do not. The field-level schema
      is documented in prose only — there is no provider-published OpenAPI or JSON Schema.
    humanURL: https://planomy.net/data/
    baseURL: https://planomy.net
