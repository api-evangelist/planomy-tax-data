name: Planomy Tax Data
description: >-
  A free, keyless open-data JSON API publishing the 2026 US retirement and tax figures that drive the
  Planomy local-first personal-finance planner: federal income-tax brackets and the standard deduction,
  FICA rates and the Social Security wage base, the COLA and retirement earnings test, Medicare Part
  A/B/D premiums and deductibles with the full IRMAA tier tables, contribution limits for employer
  plans, IRA, SIMPLE, HSA, HDHP and health FSA, Roth and traditional-IRA phase-outs, Saver's Credit
  thresholds, RMD applicable ages, and a set of state income-tax presets. Two static JSON endpoints —
  a year manifest and one document per tax year — served from a Cloudflare CDN with no key, no
  sign-up and no quota. Its distinguishing feature is provenance: every section carries a source key
  that resolves to a named IRS, SSA, CMS or Federal Register document with the date it was last
  verified, so any single figure can be cited back to the government publication it came from.
