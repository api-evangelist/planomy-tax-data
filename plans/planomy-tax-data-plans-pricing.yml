terms:
  cancellation: Cancel any time from the billing portal; no contract. Downgrading to Free keeps all planning features.
  refunds: No partial refunds for unused time — see https://planomy.net/legal/terms.
  trial: None — the Free plan is the full planner rather than a time-limited trial.
