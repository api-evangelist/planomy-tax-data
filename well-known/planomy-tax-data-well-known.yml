gaps:
  - >-
    No /.well-known/security.txt. For a public-domain dataset with no auth, a security.txt naming a
    contact and a policy URL is the cheapest credibility artifact available and would also satisfy the
    consent/identity signal agents look for.
  - >-
    No /.well-known/api-catalog (RFC 9727). /tax-data/index.json already is the catalog in substance —
    linking it from a well-known path would make it discoverable without reading the docs page.
