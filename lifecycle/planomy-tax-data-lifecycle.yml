versioning:
  scheme: uri-path + payload field
  current: v1
  current_dataset_year: 2026
  docs: https://planomy.net/data/
  detail: >-
    The tax year is a path segment (/tax-data/{year}.json) and the contract version is a `version`
    field inside the document (currently "v1"). /tax-data/index.json is the manifest — `latest`,
    `years[]` and `yearUrlTemplate` — and is the supported way to discover a new year.
  compatibility_policy: >-
    "Stable, additive contract: fields are added, never silently renamed or repurposed. A breaking
    change would ship under a new `version`." — https://planomy.net/data/
release_cadence:
  scheme: upstream-driven
  statement: >-
    "Whenever the agencies publish. Retirement plan limits normally arrive in late October or early
    November for the following year, HSA figures in the spring, and Medicare premiums in November."
  dataset_published_at: '2026-07-03T00:00:00.000Z'
  dataset_last_updated: '2026-07-27'
  freshness_signal: >-
    Every document carries `publishedAt` and `lastUpdated`, and every citation in `sources` carries its
    own `retrieved` date. A consumer can therefore verify staleness per figure, not just per file —
    an unusually good freshness contract for an open dataset.
